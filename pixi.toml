[workspace]
name = "ia_PoC_004"
channels = ["conda-forge"]
platforms = ["win-64"]
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"

[dependencies]
python = "3.12.*"
numpy = ">=2"
scipy = ">=1.13"
scikit-image = ">=0.24"
matplotlib = ">=3.9"
pytest = ">=8"

[pypi-dependencies]
# Shared analysis basis (CZI reading, pixel <-> stage, logging, scale bars),
# pinned to a published commit. To develop against a local checkout instead:
#   ia_common = { path = "../ia_common", editable = true, extras = ["display"] }
ia_common = { git = "https://github.com/Mike587/ia_common.git", rev = "58cf18e6f8a52380fe19f7eaaae2283c137ddd01", extras = ["display"] }

[tasks]
test = "pytest -q"
